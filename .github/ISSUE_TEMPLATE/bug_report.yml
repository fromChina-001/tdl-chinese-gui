name: 错误报告
description: 报告可以稳定复现的软件问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先删除或遮挡 Telegram 消息链接、账号 ID、手机号、代理密码和本地会话。
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 64 位
    validations:
      required: true
  - type: input
    id: tdl
    attributes:
      label: tdl 版本
      placeholder: v0.20.4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请描述从启动软件到出现问题的具体步骤。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除账号、消息链接、代理密码和会话文件。
          required: true